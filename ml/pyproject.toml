[project]
name = "coordit-garment-ml"
version = "0.1.0"
description = "Quarantined garment research, approved provenance and measurement rejection gates"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.12,<3", "numpy>=2.2,<3", "pillow>=12,<13",
  "torch==2.9.1", "fastapi>=0.120,<1", "uvicorn>=0.38,<1",
  "httpx2[http2,brotli,zstd]>=2,<3",
]
[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "basedpyright>=1.31,<2", "httpx>=0.28,<1"]
export = ["onnx>=1.19,<2", "onnxscript>=0.5,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["ALL"]
# Domain constants and typed boundary error messages are intentional. Dependency
# adapters use upstream Torch conventions; these exceptions do not waive typing.
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "TRY003", "EM101", "EM102", "PLR2004", "D401"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004", "INP001"]
"coordit_ml/__main__.py" = ["T201", "PLC0415", "C901", "PLR0912", "PLR0915"]
"coordit_ml/acquisition.py" = ["C901", "PLR0912", "PLR0915"]
"coordit_ml/evaluation.py" = ["C901", "PLR0912", "PLR0915"]
"coordit_ml/synthetic.py" = ["S311", "C901", "PLR0912", "PLR0915"]
"coordit_ml/training.py" = ["S311", "C901", "PLR0912", "PLR0915"]
"coordit_ml/provenance.py" = ["C901", "PLR0912"]
"coordit_ml/network.py" = ["N812", "FBT001", "FBT002"]
"coordit_ml/heatmap_network.py" = ["N812", "FBT001", "FBT002"]
"coordit_ml/synthetic_details.py" = ["S311", "C901", "PLR0912", "PLR0915"]
"coordit_ml/proposal_validation.py" = ["PLR0911"]
"coordit_ml/model_factory.py" = ["FBT001"]
"coordit_ml/service.py" = ["PLC0415", "FAST001"]
[tool.ruff.lint.mccabe]
max-complexity = 15
[tool.basedpyright]
typeCheckingMode = "all"
# Torch's native loader/autograd/ONNX stubs have partially dynamic signatures.
# Keep these diagnostics visible as warnings; input parsing remains strict.
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportAny = "warning"
reportUnusedCallResult = "warning"
# Exhaustive assert_never branches are required even when statically unreachable.
reportUnnecessaryComparison = "none"
pythonVersion = "3.12"
include = ["coordit_ml", "tests"]
exclude = ["artifacts", ".venv"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["coordit_ml"]
